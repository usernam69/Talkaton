import requests
import base64

url = "http://googleusercontent.com/image_generation_content/414"
try:
    response = requests.get(url, timeout=10)
    if response.status_code == 200:
        b64_img = base64.b64encode(response.content).decode('utf-8')
        svg_content = f"""<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <image href="data:image/png;base64,{b64_img}" width="1024" height="1024" />
</svg>"""
        with open('favicon.svg', 'w') as f:
            f.write(svg_content)
        print("Successfully created favicon.svg")
    else:
        print(f"Failed to download, status code: {response.status_code}")
except Exception as e:
    print(f"Exception: {e}")
